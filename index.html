<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase Auth Demo - Phone OTP & Email Login</title>
  
  <!-- Firebase SDKs (Compat version for simple vanilla HTML/JS) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      padding: 2.25rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #f59e0b; /* Firebase orange/yellow accent */
      text-align: center;
    }
    p.subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 1.75rem;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 0.375rem;
    }
    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      color: #f8fafc;
      font-size: 0.9375rem;
      transition: all 0.2s ease;
    }
    input:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      border: none;
      border-radius: 0.5rem;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.92;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .switch-view {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .switch-view a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .switch-view a:hover {
      text-decoration: underline;
    }
    .config-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .hidden {
      display: none;
    }
    #recaptcha-container {
      margin: 10px 0;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="card">


    <!-- SIGN IN VIEW -->
    <div id="signin-view">
      <h2>Sign In</h2>
      <p class="subtitle">Enter your email and password</p>
      <form onsubmit="handleSignIn(event)">
        <div class="form-group">
          <label for="signin-email">Email Address</label>
          <input type="email" id="signin-email" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.375rem;">
            <label for="signin-pass" style="margin-bottom:0;">Password</label>
            <a onclick="showView('forgot-view')" style="font-size:0.75rem; color:#f59e0b; cursor:pointer;">Forgot via OTP?</a>
          </div>
          <input type="password" id="signin-pass" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>
      <div class="switch-view">
        New here? <a onclick="showView('signup-view')">Create an Account</a>
      </div>
    </div>

    <!-- SIGN UP VIEW -->
    <div id="signup-view" class="hidden">
      <h2>Sign Up</h2>
      <p class="subtitle">Create a new user account</p>
      <form onsubmit="handleSignUp(event)">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="Rahul Sharma" required />
        </div>
        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label for="signup-pass">Password</label>
          <input type="password" id="signup-pass" placeholder="At least 6 characters" required />
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
      <div class="switch-view">
        Already registered? <a onclick="showView('signin-view')">Sign In</a>
      </div>
    </div>

    <!-- FORGOT / PHONE OTP LOGIN (STEP 1: PHONE NUMBER) -->
    <div id="forgot-view" class="hidden">
      <h2>Phone OTP</h2>
      <p class="subtitle">Enter your 10-digit mobile number</p>
      <form onsubmit="handleSendOtp(event)">
        <div class="form-group">
          <label for="phone-number">Mobile Number</label>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="background: #0f172a; border: 1px solid #334155; padding: 0.75rem 0.85rem; border-radius: 0.5rem; color: #f59e0b; font-weight: 700; font-size: 0.9375rem;">+91</span>
            <input type="tel" id="phone-number" maxlength="10" placeholder="9876543210" pattern="[0-9]{10}" required style="flex: 1;" />
          </div>
        </div>
        <div id="recaptcha-container"></div>
        <button type="submit" id="send-otp-btn" class="btn">Send Real SMS OTP</button>
      </form>
      <div class="switch-view">
        <a onclick="showView('signin-view')">Back to Sign In</a>
      </div>
    </div>

    <!-- OTP VERIFY (STEP 2: ENTER OTP) -->
    <div id="otp-view" class="hidden">
      <h2>Enter OTP</h2>
      <p class="subtitle" id="otp-subtitle">Check your phone SMS</p>
      <form onsubmit="handleVerifyOtp(event)">
        <div class="form-group">
          <label for="otp-code">6-Digit Code</label>
          <input type="text" id="otp-code" maxlength="6" placeholder="123456" required style="letter-spacing:4px; font-weight:700; text-align:center;" />
        </div>
        <button type="submit" class="btn">Verify & Sign In</button>
      </form>
      <div class="switch-view">
        <a onclick="showView('forgot-view')">Change Number</a>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. YOUR FIREBASE CONFIGURATION OBJECT
    // (Replace the values below with your Firebase project details)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBFqyXTAjymVcMftZBkkJVHVpM22XFt-Bw",
      authDomain: "test-c4355.firebaseapp.com",
      projectId: "test-c4355",
      storageBucket: "test-c4355.firebasestorage.app",
      messagingSenderId: "172007745233",
      appId: "1:172007745233:web:88662d494bd00de0c107f0",
      measurementId: "G-DWYRKQFN9J"
    };

    // Initialize Firebase directly with your project credentials
    firebase.initializeApp(firebaseConfig);

    let confirmationResult = null;
    let recaptchaVerifier = null;

    function initRecaptcha() {
      if (!recaptchaVerifier && firebase.apps.length > 0) {
        recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
          'size': 'invisible',
          'callback': function(response) {
            // reCAPTCHA solved
          }
        });
      }
    }

    function showView(viewId) {
      ['signin-view', 'signup-view', 'forgot-view', 'otp-view'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
      if (viewId === 'forgot-view') {
        initRecaptcha();
      }
    }

    // Email Sign In
    async function handleSignIn(e) {
      e.preventDefault();
      const email = document.getElementById('signin-email').value;
      const pass = document.getElementById('signin-pass').value;
      try {
        const userCred = await firebase.auth().signInWithEmailAndPassword(email, pass);
        alert("Signed in successfully as " + userCred.user.email);
      } catch (err) {
        alert("Login Error: " + err.message);
      }
    }

    // Email Sign Up
    async function handleSignUp(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const pass = document.getElementById('signup-pass').value;
      try {
        const userCred = await firebase.auth().createUserWithEmailAndPassword(email, pass);
        await userCred.user.updateProfile({ displayName: name });
        alert(`Account created for ${name}!`);
        showView('signin-view');
      } catch (err) {
        alert("Sign Up Error: " + err.message);
      }
    }

    // Phone OTP Send
    async function handleSendOtp(e) {
      e.preventDefault();
      let rawNumber = document.getElementById('phone-number').value.trim().replace(/\D/g, '');
      if (rawNumber.length !== 10) {
        alert("कृपया 10 अंकों का मोबाइल नंबर डालें।");
        return;
      }
      const phoneNumber = '+91' + rawNumber;
      const btn = document.getElementById('send-otp-btn');
      btn.innerText = "Sending SMS...";
      btn.disabled = true;

      try {
        initRecaptcha();
        confirmationResult = await firebase.auth().signInWithPhoneNumber(phoneNumber, recaptchaVerifier);
        document.getElementById('otp-subtitle').innerText = `OTP sent to ${phoneNumber}`;
        showView('otp-view');
      } catch (err) {
        alert("Failed to send OTP: " + err.message);
        if (recaptchaVerifier) recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
      } finally {
        btn.innerText = "Send Real SMS OTP";
        btn.disabled = false;
      }
    }

    // Phone OTP Verify
    async function handleVerifyOtp(e) {
      e.preventDefault();
      const otpCode = document.getElementById('otp-code').value.trim();
      try {
        const result = await confirmationResult.confirm(otpCode);
        alert(`Phone verified successfully! Logged in as: ${result.user.phoneNumber}`);
        showView('signin-view');
      } catch (err) {
        alert("Incorrect or Expired OTP: " + err.message);
      }
    }
  </script>
</body>
</html>
